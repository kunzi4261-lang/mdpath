[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpath"
dynamic = ["version"]
description = "Check local Markdown links and image paths, with source-line diagnostics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mdpath = "mdpath:main"

[project.urls]
Repository = "https://github.com/kunzi4261-lang/mdpath"
Issues = "https://github.com/kunzi4261-lang/mdpath/issues"

[tool.setuptools]
py-modules = ["mdpath", "mdlinks"]

[tool.setuptools.dynamic]
version = {attr = "mdpath.__version__"}
